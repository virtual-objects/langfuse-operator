---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfuseconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfuseconnections/status
  - langfusemodels/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfusemodels
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfusemodels/finalizers
  verbs:
  - update
