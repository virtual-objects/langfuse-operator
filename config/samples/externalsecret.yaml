# Example: deliver the project key pair with External Secrets Operator.
# Not included in kustomization.yaml because it needs ESO and a SecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-project-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store
  target:
    name: langfuse-project-keys
  data:
    - secretKey: public_key
      remoteRef: {key: langfuse/my-project, property: public_key}
    - secretKey: secret_key
      remoteRef: {key: langfuse/my-project, property: secret_key}
