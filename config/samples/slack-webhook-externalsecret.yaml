# Example: deliver the Slack webhook URL with External Secrets Operator.
# Not included in kustomization.yaml because it needs ESO and a SecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-langfuse-alerts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store
  target:
    name: slack-langfuse-alerts
  data:
    - secretKey: webhook_url
      remoteRef: {key: slack/langfuse-alerts, property: webhook_url}
