name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the LangfuseConnection / LangfuseModel YAML (remove secrets).
      render: yaml
    validations: {required: true}
  - type: textarea
    id: status
    attributes:
      label: Resource status and operator logs
      description: Output of `kubectl describe lfmodel <name>` and relevant operator log lines.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: operator v0.1.0, Langfuse 3.227, Kubernetes 1.33
    validations: {required: true}
