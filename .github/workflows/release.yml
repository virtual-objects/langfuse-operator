name: Release

# Push a tag such as v0.1.0 to publish:
#   - multi-arch image  ghcr.io/<owner>/langfuse-operator:<tag> (signed, with SBOM and provenance)
#   - Helm chart        oci://ghcr.io/<owner>/charts/langfuse-operator:<version>
#   - install.yaml and the packaged chart attached to a GitHub release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push image and chart to ghcr.io
      id-token: write   # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/langfuse-operator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Derive versions
        id: v
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: make test

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
            ${{ env.IMAGE }}:latest
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v4
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Build install.yaml
        run: make build-installer IMG="${IMAGE}:${{ steps.v.outputs.tag }}"

      - uses: azure/setup-helm@v5
      - name: Package and push Helm chart
        run: |
          sed -i "s|^\(\s*repository:\).*langfuse-operator$|\1 ${IMAGE}|; s|^\(\s*tag:\) v.*$|\1 ${{ steps.v.outputs.tag }}|" dist/chart/values.yaml
          helm package dist/chart --version ${{ steps.v.outputs.chart }} --app-version ${{ steps.v.outputs.tag }} -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/langfuse-operator-${{ steps.v.outputs.chart }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          CHART: ${{ steps.v.outputs.chart }}
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/install.yaml "dist/langfuse-operator-${CHART}.tgz" "${args[@]}"
