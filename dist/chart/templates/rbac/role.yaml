{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: langfuse-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfuseconnections
  - langfusecostalerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfuseconnections/status
  - langfusecostalerts/status
  - langfusemodels/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfusemodels
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - langfuse.virtual-objects.github.io
  resources:
  - langfusemodels/finalizers
  verbs:
  - update
{{- end -}}
